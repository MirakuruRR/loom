[workspace]
members = ["packages/*"]
# What Loom ships; xtask is only for working on it.
default-members = ["packages/loom", "packages/loom-cli", "packages/loom-mcp"]
resolver = "3"

# One version for every package: the version a release is named after.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Zlib"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
loom = { path = "packages/loom" }
lsp-server = "0.10.0"
lsp-types = "0.95.1"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std"] }
